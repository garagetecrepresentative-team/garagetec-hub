<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage Tec — Weekly Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1828; --card:#1A2D46; --card2:#1E3354; --orange:#F46B1B;
    --orange-dim:rgba(244,107,27,.15); --green:#2ECC7A; --text:#DDE6F4;
    --muted:#6C87A8; --border:#1F3555;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;padding:24px 16px;font-size:14px;line-height:1.6;}
  .wrap{max-width:560px;margin:0 auto;}
  .head{margin-bottom:20px;}
  .head .logo{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;color:#fff;}
  .head .sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;}
  .card h3{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
  .alert{border-radius:7px;padding:11px 15px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;border:1px solid;}
  .alert.blue{background:rgba(58,144,245,.12);border-color:rgba(58,144,245,.3);}
  .alert.green{background:rgba(46,204,122,.12);border-color:rgba(46,204,122,.3);}
  .alert.yellow{background:rgba(245,197,24,.12);border-color:rgba(245,197,24,.3);}
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .form-group input, .form-group textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;outline:none;}
  .form-group textarea{resize:vertical;min-height:60px;}
  .day-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .day-row:last-child{border-bottom:none;}
  .day-row .day-name{width:92px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;flex-shrink:0;}
  .day-row label{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;}
  .day-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer;}
  .day-row input[type=time]{background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:5px 7px;color:var(--text);font-size:12.5px;width:100px;}
  .day-row.disabled input[type=time]{opacity:.4;pointer-events:none;}
  button.submit{width:100%;background:var(--green);color:#fff;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.4px;padding:13px;border-radius:8px;cursor:pointer;}
  button.submit:hover{opacity:.9;}
  #statusMsg{margin-top:12px;font-size:13px;text-align:center;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">GARAGE TEC</div>
    <div class="sub">Weekly Availability</div>
  </div>

  <div id="noTokenWarning" class="alert yellow hidden"><div>⚠️</div><div>This link is missing your personal ID. Ask your dispatcher for your correct link.</div></div>
  <div id="greeting" class="alert blue hidden"><div>👋</div><div>Hi <strong id="greetName">—</strong>, let us know when you're available this week.</div></div>

  <div class="card">
    <h3>Week Of</h3>
    <div class="form-group" style="margin-bottom:0;">
      <input type="date" id="weekOf">
    </div>
  </div>

  <div class="card">
    <h3>Your Availability</h3>
    <div id="dayList"></div>
  </div>

  <div class="card">
    <h3>Notes (optional)</h3>
    <div class="form-group" style="margin-bottom:0;">
      <textarea id="notes" placeholder="Anything dispatch should know — time off, preferred areas, etc."></textarea>
    </div>
  </div>

  <button class="submit" onclick="submitAvailability()">✅ Submit Availability</button>
  <div id="statusMsg"></div>
</div>

<script>
const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

function getUrlToken(){
  return new URLSearchParams(window.location.search).get('t') || '';
}

// Reads the same Sheet Web App URL the Hub uses — set once by whoever set
// up the Hub. If this form is hosted alongside the Hub file, it can share
// the same localStorage; if opened directly by a tech on their own device
// it won't have that, so we also allow ?api=<url> as a fallback in the link.
function getSheetUrl(){
  const fromQuery = new URLSearchParams(window.location.search).get('api');
  if(fromQuery) return fromQuery;
  try{
    const cfg = JSON.parse(localStorage.getItem('gt_emailjs_config') || '{}');
    return cfg.sheetUrl || '';
  } catch(err){ return ''; }
}

function mondayOf(dateStr){
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}

function buildDayList(){
  const container = document.getElementById('dayList');
  container.innerHTML = '';
  days.forEach(day=>{
    const row = document.createElement('div');
    row.className = 'day-row disabled';
    row.id = 'row-' + day;
    row.innerHTML = `
      <div class="day-name">${day}</div>
      <label><input type="checkbox" onchange="toggleDay('${day}')" id="chk-${day}"> Available</label>
      <input type="time" id="start-${day}" value="08:00">
      <span style="color:var(--muted);">–</span>
      <input type="time" id="end-${day}" value="17:00">
    `;
    container.appendChild(row);
  });
}

function toggleDay(day){
  const row = document.getElementById('row-' + day);
  const checked = document.getElementById('chk-' + day).checked;
  row.classList.toggle('disabled', !checked);
}

async function submitAvailability(){
  const token = getUrlToken();
  const sheetUrl = getSheetUrl();
  if(!sheetUrl){
    document.getElementById('statusMsg').textContent = 'This form isn\'t connected yet — ask your dispatcher to check the link.';
    document.getElementById('statusMsg').style.color = 'var(--muted)';
    return;
  }
  const weekOf = mondayOf(document.getElementById('weekOf').value);
  const notes = document.getElementById('notes').value.trim();
  const availability = {};
  days.forEach(day=>{
    const checked = document.getElementById('chk-' + day).checked;
    availability[day] = checked
      ? { available: true, start: document.getElementById('start-' + day).value, end: document.getElementById('end-' + day).value }
      : { available: false };
  });

  const statusEl = document.getElementById('statusMsg');
  statusEl.textContent = 'Submitting...';
  statusEl.style.color = 'var(--muted)';

  try{
    const res = await fetch(sheetUrl, {
      method: 'POST',
      body: JSON.stringify({ action: 'addAvailability', token, weekOf, availability, notes })
    });
    const result = await res.json();
    if(result && result.ok){
      statusEl.textContent = '✅ Submitted — thank you!';
      statusEl.style.color = 'var(--green)';
    } else {
      throw new Error((result && result.error) || 'Unknown error');
    }
  } catch(err){
    statusEl.textContent = '⚠️ Could not submit — check your connection and try again.';
    statusEl.style.color = '#E05252';
    console.error(err);
  }
}

async function loadWhoAmI(){
  const token = getUrlToken();
  if(!token){
    document.getElementById('noTokenWarning').classList.remove('hidden');
    return;
  }
  const sheetUrl = getSheetUrl();
  if(!sheetUrl) return;
  try{
    const res = await fetch(`${sheetUrl}?action=whoami&t=${encodeURIComponent(token)}`);
    const result = await res.json();
    if(result && result.data){
      document.getElementById('greetName').textContent = result.data.Name;
      document.getElementById('greeting').classList.remove('hidden');
    }
  } catch(err){ /* non-fatal */ }
}

document.getElementById('weekOf').value = mondayOf();
buildDayList();
loadWhoAmI();
</script>
</body>
</html>
